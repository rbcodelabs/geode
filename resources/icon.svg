<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Geode app icon: faceted gem mark, matching the geode-site brand (favicon.svg / nav
       logo) instead of the earlier photorealistic amethyst render. Flat, geometric,
       brand palette (#294835 chip, #DBEA9D -> #789348 gem gradient), composited on the
       macOS icon grid (824 body in 1024 canvas) with a bevel rim and drop shadow. -->
  <defs>
    <linearGradient id="gem" x1="306" y1="254.5" x2="718" y2="769.5" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DBEA9D" />
      <stop offset="1" stop-color="#789348" />
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="100" x2="0" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DBEA9D" stop-opacity="0.95" />
      <stop offset="1" stop-color="#789348" stop-opacity="0.95" />
    </linearGradient>
    <linearGradient id="topHi" x1="0" y1="100" x2="0" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <filter id="ds" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- drop shadow (shadow caster only; the opaque body below fully covers it) -->
  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="#000000" filter="url(#ds)" opacity="0.9" />

  <!-- squircle body chip -->
  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="#294835" />

  <!-- brand-gradient rim -->
  <rect x="107" y="107" width="810" height="810" rx="177" ry="177" fill="none" stroke="url(#rim)" stroke-width="12" />

  <!-- faceted gem mark, centered -->
  <path d="M512,254.5 L718,409 L640.75,769.5 L383.25,769.5 L306,409 Z" fill="url(#gem)" />
  <path d="M512,254.5 L718,409 L640.75,769.5 L512,512 Z" fill="#294835" fill-opacity="0.24" />
  <path d="M512,254.5 L512,512 L383.25,769.5 L306,409 Z" fill="#294835" fill-opacity="0.08" />

  <!-- top glass highlight -->
  <rect x="100" y="100" width="824" height="824" rx="184" ry="184" fill="url(#topHi)" />
</svg>
