<!doctype html><meta charset="utf-8"><title>Workspaces manager reference</title>
<style>body{background:#171717;color:#ddd;font:14px system-ui;margin:0;display:grid;place-items:center;height:100vh}.modal{background:#252525;border:1px solid #444;border-radius:12px;padding:24px;width:440px;box-shadow:0 12px 60px #0008}h1{font-size:20px;margin:0 0 20px}label{display:block;margin-bottom:8px}input{background:#1e1e1e;color:#eee;border:1px solid #7664d8;padding:9px;border-radius:6px;flex:1;min-width:0}button{background:#393939;color:#ddd;border:1px solid #555;border-radius:5px;padding:7px 12px}.save{background:#6750a4}form,.row{display:flex;gap:8px;align-items:center}.row{border-top:1px solid #444;margin-top:14px;padding-top:14px}.name{flex:1}.status{font-size:13px;color:#aaa;margin-top:16px}.error{color:#f09898}</style>
<main class="modal"><h1>Manage workspace layouts</h1><label for="name">Name</label><form><input id="name" value="Writing"><button class="save" type="button">Save</button></form><p class="status">Saving with the same name updates that layout.</p><div class="row"><span class="name">Writing</span><button>Load</button><button aria-label="Delete Writing layout">Delete layout</button></div><div class="row"><span class="name">Reading</span><button>Load</button><button aria-label="Delete Reading layout">Delete layout</button></div><p class="status" role="status">Saved Writing.</p><p class="status error">Error state: Could not save. Existing layouts and this name are preserved.</p></main>
