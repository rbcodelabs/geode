name: iOS TestFlight

# Builds the Capacitor iOS app, signs it with cloud-managed distribution signing
# (App Store Connect API key, no certificate handling here) and uploads it to
# TestFlight. Run manually or push a tag like ios-v0.25.0 (must match package.json).
on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload to App Store Connect (false = build and export the ipa only)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  testflight:
    # Signing secrets live in this environment (shared with the desktop release);
    # its required-reviewer rule is the approval gate for every run.
    environment: macos-release
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      # Tag pushes always upload; manual runs upload only when the input is true.
      DO_UPLOAD: ${{ github.event_name == 'push' || inputs.upload }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: npm
      - name: Check tag matches package.json
        if: github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          expected="ios-v$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF_NAME" == "$expected" ]] || { echo "Tag $GITHUB_REF_NAME does not match package.json ($expected)" >&2; exit 1; }
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Sync iOS project (version, renderer bundle, plugins)
        env:
          # Monotonic per workflow; App Store Connect requires it to increase per version.
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: npm run ios:sync
      - name: Archive
        shell: bash
        run: |
          set -euo pipefail
          # Unsigned archive; the export step re-signs with a cloud-managed Apple
          # Distribution certificate. (An automatically signed archive would need a
          # registered development device.)
          xcodebuild archive \
            -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Geode.xcarchive" \
            CODE_SIGNING_ALLOWED=NO
      - name: Export, sign, and (optionally) upload to TestFlight
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing required secret: $name" >&2; exit 1; }
          done
          [[ "$APPLE_TEAM_ID" == "6M8F464WCQ" ]] || { echo "APPLE_TEAM_ID does not match the team pinned in ios/ExportOptions.plist" >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"

          options="$RUNNER_TEMP/ExportOptions.plist"
          cp ios/ExportOptions.plist "$options"
          if [[ "$DO_UPLOAD" == "true" ]]; then
            /usr/libexec/PlistBuddy -c "Set :destination upload" "$options"
          fi

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Geode.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$options" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$key_path" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER"
      - name: Upload ipa artifact
        if: env.DO_UPLOAD != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: geode-ios-ipa
          path: ${{ runner.temp }}/export/*.ipa
          retention-days: 7
