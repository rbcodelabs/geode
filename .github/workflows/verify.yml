name: Verify

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-latest
    # The serial macOS e2e gate (~520 specs) needs ~33 min since the managed-policy specs landed; it was cancelled at
    # exactly 30 min on main (0c864be) and on PR #438. Same checks, just room to finish.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Plain Node extraction proof
        run: npm run proof:headless
      - name: Local wiki proof
        run: npm run proof:local-wiki
      - name: Unit, build and Electron regression gate
        run: npm test
      - name: Upload desktop Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-playwright-results
          path: test-results/
          retention-days: 7

  mobile:
    # Keeps the mobile renderer suite (tests/mobile) from drifting away from the
    # desktop renderer it shares code with. The native iOS simulator gate
    # (scripts/ios-mvp-acceptance.sh) needs Xcode and stays a local release check.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build mobile renderer
        run: npm run build:mobile
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - name: Mobile Playwright suite
        run: npx playwright test --config playwright.mobile.config.ts --workers=2
      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-playwright-results
          path: test-results/
          retention-days: 7

  ios-swift:
    # Swift errors must fail PRs, not `ios-v*` tag builds (ADR 0030 section 4). Compiles the App target and the test
    # bundle for the simulator without signing (the entitlements file is parsed but never matched to a profile), then
    # runs the pure engine XCTests. Nothing here touches iCloud: real propagation is the two-device manual gate.
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Select Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          xcode="$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          sudo xcode-select -s "$xcode/Contents/Developer"
          xcodebuild -version
      - name: Build the app and tests for the iOS simulator
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project ios/App/App.xcodeproj -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO
      - name: iCloud container engine XCTests
        shell: bash
        run: |
          set -euo pipefail
          udid="$(xcrun simctl list devices available -j | jq -r '[.devices[][] | select(.name | startswith("iPhone"))][0].udid')"
          [[ -n "$udid" && "$udid" != "null" ]] || { echo "No iPhone simulator available" >&2; exit 1; }
          xcodebuild test-without-building \
            -project ios/App/App.xcodeproj -scheme App \
            -destination "platform=iOS Simulator,id=$udid" \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            -only-testing:AppUITests/IcloudContainerEngineTests \
            CODE_SIGNING_ALLOWED=NO 2>&1 | tee "$RUNNER_TEMP/engine-tests.log"
          # Fail if the filter matched nothing (xcodebuild can exit 0 with zero tests).
          grep -Eq "Executed [1-9][0-9]* tests?, with 0 failures" "$RUNNER_TEMP/engine-tests.log"
