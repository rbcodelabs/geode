name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    environment: macos-release
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: npm

      - name: Read pinned Apple Team ID
        shell: bash
        run: |
          set -euo pipefail
          pinned="$(sed -nE 's/^export const EXPECTED_TEAM_ID = "([^"]+)";.*/\1/p' scripts/geode-update.mts)"
          [[ -n "$pinned" ]] || { echo "Could not read EXPECTED_TEAM_ID pin" >&2; exit 1; }
          echo "GEODE_PINNED_TEAM_ID=$pinned" >> "$GITHUB_ENV"

      - name: Verify tag matches package version
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version")"
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "Tag $GITHUB_REF_NAME does not match package version v$version" >&2; exit 1; }

      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Bundle
        run: npm run build
      - name: Package, sign, notarize, and staple
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CSC_LINK CSC_KEY_PASSWORD APPLE_API_KEY_BASE64 APPLE_API_KEY_ID APPLE_API_ISSUER APPLE_TEAM_ID; do
            [[ -n "${!name:-}" ]] || { echo "Missing required macos-release secret: $name" >&2; exit 1; }
          done
          [[ "$GEODE_PINNED_TEAM_ID" =~ ^[A-Z0-9]{10}$ ]] || { echo "Checked-in EXPECTED_TEAM_ID is not provisioned" >&2; exit 1; }
          [[ "$APPLE_TEAM_ID" == "$GEODE_PINNED_TEAM_ID" ]] || { echo "APPLE_TEAM_ID does not match checked-in EXPECTED_TEAM_ID" >&2; exit 1; }
          key_path="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          trap 'rm -f "$key_path"' EXIT
          printf '%s' "$APPLE_API_KEY_BASE64" | base64 -D > "$key_path"
          chmod 600 "$key_path"
          export APPLE_API_KEY="$key_path"
          npx electron-builder --mac --publish never

      - name: Verify signed artifacts and updater manifest
        shell: bash
        run: |
          set -euo pipefail
          verify_app() {
            local app_path="$1" details entitlements bundle_id
            [[ "$(lipo -archs "$app_path/Contents/MacOS/Geode")" == "arm64" ]] || { echo "Expected arm64-only app" >&2; exit 1; }
            codesign --verify --deep --strict "$app_path"
            details="$(codesign -dv --verbose=4 "$app_path" 2>&1)"
            grep -Fq "Authority=Developer ID Application:" <<<"$details"
            grep -Fq "TeamIdentifier=$GEODE_PINNED_TEAM_ID" <<<"$details"
            grep -Fq "Identifier=com.rbcodelabs.geode" <<<"$details"
            grep -Eq 'flags=.*\(runtime\)' <<<"$details"
            bundle_id="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app_path/Contents/Info.plist")"
            [[ "$bundle_id" == "com.rbcodelabs.geode" ]]
            entitlements="$(codesign -d --entitlements :- "$app_path" 2>/dev/null)"
            grep -Fq '<key>com.apple.security.cs.allow-jit</key>' <<<"$entitlements"
            for forbidden in com.apple.security.get-task-allow com.apple.security.cs.disable-library-validation com.apple.security.cs.allow-dyld-environment-variables com.apple.security.cs.allow-unsigned-executable-memory; do
              ! grep -Fq "<key>$forbidden</key>" <<<"$entitlements"
            done
            spctl --assess --type execute "$app_path"
            xcrun stapler validate "$app_path"
          }

          shopt -s nullglob
          dmgs=(release/*.dmg)
          zips=(release/*.zip)
          [[ ${#dmgs[@]} -eq 1 && "${dmgs[0]}" == *-arm64.dmg ]] || { echo "Expected one arm64 DMG" >&2; exit 1; }
          [[ ${#zips[@]} -eq 1 && "${zips[0]}" == *-arm64-mac.zip ]] || { echo "Expected one arm64 ZIP" >&2; exit 1; }
          for dmg in "${dmgs[@]}"; do
            mount_dir="$(mktemp -d "$RUNNER_TEMP/geode-dmg.XXXXXX")"
            hdiutil attach "$dmg" -nobrowse -readonly -mountpoint "$mount_dir"
            verify_app "$mount_dir/Geode.app"
            hdiutil detach "$mount_dir"
          done
          for zip in "${zips[@]}"; do
            extract_dir="$(mktemp -d "$RUNNER_TEMP/geode-zip.XXXXXX")"
            ditto -x -k "$zip" "$extract_dir"
            verify_app "$extract_dir/Geode.app"
          done

          node <<'NODE'
          const fs = require('node:fs');
          const path = require('node:path');
          const YAML = require('yaml');
          const manifestPath = 'release/latest-mac.yml';
          if (!fs.existsSync(manifestPath)) throw new Error('latest-mac.yml is missing');
          const manifest = YAML.parse(fs.readFileSync(manifestPath, 'utf8'));
          const zipPaths = (manifest.files ?? []).map(entry => entry.url ?? entry.path).filter(value => typeof value === 'string' && value.endsWith('.zip'));
          if (zipPaths.length !== 1 || !zipPaths[0].endsWith('-arm64-mac.zip')) throw new Error('latest-mac.yml must reference exactly one arm64 ZIP');
          for (const relative of zipPaths) {
            const name = path.basename(relative);
            if (!fs.existsSync(path.join('release', name))) throw new Error(`Manifest ZIP missing: ${name}`);
            if (!fs.existsSync(path.join('release', `${name}.blockmap`))) throw new Error(`Manifest blockmap missing: ${name}.blockmap`);
          }
          NODE
          printf '{"teamId":"%s","bundleId":"com.rbcodelabs.geode"}\n' "$GEODE_PINNED_TEAM_ID" > release/geode-release.json

      - name: Publish complete draft release atomically
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            [[ "$(gh release view "$tag" --json isDraft --jq .isDraft)" == "true" ]] || { echo "Refusing to modify already-published release $tag" >&2; exit 1; }
          else
            gh release create "$tag" --draft --title "$tag" --generate-notes
          fi
          shopt -s nullglob
          assets=(release/*.dmg release/*.zip release/latest-mac.yml release/*.blockmap release/geode-release.json)
          [[ ${#assets[@]} -ge 5 ]] || { echo "Incomplete artifact set (${#assets[@]} files)" >&2; exit 1; }
          uploaded=false
          for attempt in 1 2 3 4 5; do
            if gh release upload "$tag" "${assets[@]}" --clobber; then uploaded=true; break; fi
            sleep $((attempt * 10))
          done
          [[ "$uploaded" == "true" ]] || { echo "All upload attempts failed" >&2; exit 1; }
          expected="$(for asset in "${assets[@]}"; do basename "$asset"; done | sort)"
          actual="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
          [[ "$actual" == "$expected" ]] || { echo "Draft asset inventory mismatch" >&2; diff <(printf '%s\n' "$expected") <(printf '%s\n' "$actual") || true; exit 1; }
          gh release edit "$tag" --draft=false
