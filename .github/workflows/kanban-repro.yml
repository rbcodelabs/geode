# TEMPORARY: reproduces the macOS-only Kanban formula e2e flake in minutes instead of the 30+ min `verify` job.
# Delete before merging.
name: kanban-repro
on:
  push:
    branches: [fix/bases-kanban-formula-flake]
jobs:
  repro:
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Kanban spec x6, no retries
        run: npx playwright test tests/e2e/bases-plugin-view.spec.ts --workers=1 --retries=0 --repeat-each=6 --grep "formula property"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kanban-repro-results
          path: test-results/
          retention-days: 3
