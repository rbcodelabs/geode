name: Verify (Windows)

# Advisory Windows gate. Geode's unit suite has known Windows failures (see
# Products/Geode/Windows-test-baseline in the vault); `continue-on-error` keeps this job from blocking PRs while those
# are burned down. When it is consistently green, drop `continue-on-error` and add it to the required checks.
# It is deliberately separate from verify.yml / verify-fast.yml so it can never delay or fail the required gates.

on:
  pull_request: {}
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-windows-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    runs-on: windows-latest
    timeout-minutes: 25
    continue-on-error: true
    steps:
      # Must run before checkout: the runner's Git defaults to core.autocrlf=true, which turns LF fixtures into CRLF.
      - name: Keep LF line endings
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: "25"
          cache: npm
      - name: Install dependencies
        run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
