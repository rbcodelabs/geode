name: flaky-repro
on:
  push:
    branches: [fix/flaky-macos-e2e]
jobs:
  slash:
    runs-on: macos-latest
    timeout-minutes: 40
    steps: &steps
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: "25", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright test tests/e2e/slash-commands.spec.ts --workers=1 --retries=0 --repeat-each=40
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: results-slash, path: test-results/, retention-days: 3 }
  notices:
    runs-on: macos-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: "25", cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npx playwright test tests/e2e/notices.spec.ts --workers=1 --retries=0 --repeat-each=20
